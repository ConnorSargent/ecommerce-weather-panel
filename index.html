<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Panel</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="panel">

    <!-- Search spans the full panel, columns sit underneath -->
    <div class="search">
      <label for="search-input">Where are you off to?</label>
      <input id="search-input" type="search" placeholder="Search a UK town or city..."
             autocomplete="off" aria-controls="search-results">

      <!-- Buttons to select a location/Native button would be better on mobile-->
      <ul id="search-results" class="search-results"></ul>
    </div>

    <!-- Left column: weather -->
    <section class="weather-col">
      <!-- polite for screen readers -->
      <p id="status" class="status" role="status" aria-live="polite"></p>

      <div id="current" class="current-card"></div>

      <div id="outlook" class="outlook"></div>
    </section>

    <!-- Right column: merchandising -->
    <section class="merch-col">
      <p class="merch-eyebrow">Planning your next trip?</p>
      <h2 id="merch-message" class="merch-message"></h2>

      <!-- placeholder product cards, real ones would come from shopify-->
      <div class="product-carousel" aria-hidden="true">
        <div class="product-skeleton"></div>
        <div class="product-skeleton"></div>
        <div class="product-skeleton"></div>
        <div class="product-skeleton"></div>
        <div class="product-skeleton"></div>
        <div class="product-skeleton"></div>
      </div>

      <a href="#" class="shop-all">Shop All Outerwear</a>
    </section>

  </main>
</body>
</html>
